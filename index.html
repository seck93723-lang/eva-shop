<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eva Shop">
<title>Eva Shop Gestion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f2e8; --card:#fffdf8; --ink:#1d1912; --muted:#7a6f5c; --line:#e6dcc7;
  --gold:#b8892c; --gold2:#d9b25a; --goldsoft:#f3e6c4; --dark:#14110c;
  --ok:#2f7d4f; --okbg:#e2f2e7; --warn:#a8641a; --warnbg:#fbecd6; --bad:#b03a2e; --badbg:#f8e1dd;
  --blue:#2d5f9a; --bluebg:#e1ebf7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0b08; --card:#1a1610; --ink:#f3ead6; --muted:#a89a7e; --line:#2f281c;
    --gold:#d9b25a; --gold2:#f0cf7f; --goldsoft:#2c2414; --dark:#000;
    --ok:#6fcf97; --okbg:#16291d; --warn:#f2b26b; --warnbg:#2e2112; --bad:#f08b7f; --badbg:#2e1613;
    --blue:#8ab4ea; --bluebg:#142235;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0b08; --card:#1a1610; --ink:#f3ead6; --muted:#a89a7e; --line:#2f281c;
  --gold:#d9b25a; --gold2:#f0cf7f; --goldsoft:#2c2414; --dark:#000;
  --ok:#6fcf97; --okbg:#16291d; --warn:#f2b26b; --warnbg:#2e2112; --bad:#f08b7f; --badbg:#2e1613;
  --blue:#8ab4ea; --bluebg:#142235;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;font-size:16px;line-height:1.4;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* header */
header{background:#0d0b08;color:#f3ead6;padding:calc(14px + env(safe-area-inset-top)) 0 16px;border-bottom:2px solid #d9b25a}
header .wrap{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a2316,#000);border:1.5px solid #d9b25a;display:grid;place-items:center;font-family:'Great Vibes',cursive;color:#e9c46a;font-size:19px;line-height:1;flex:none}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-family:'Great Vibes',cursive;font-weight:400;font-size:32px;color:#e9c46a;line-height:1}
.brand small{display:block;color:#a89a7e;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.iconbtn{background:none;border:1px solid #3a3122;color:#e9c46a;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#0d0b08;border-top:1px solid #3a3122;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;color:#8f8268;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;padding:6px 0;cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:#e9c46a}

h2{font-size:20px;margin:20px 0 10px;font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.stat.gold{background:linear-gradient(135deg,#1c160c,#0d0b08);border-color:#5a4720;color:#f3ead6}
.stat.gold b{color:#e9c46a}.stat.gold span{color:#b9a988}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--gold);color:#140f05;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.full{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.dark{background:var(--dark);color:#e9c46a;border:1px solid #3a3122}
.btn.wa{background:#25d366;color:#05210f}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#f0cf7f,#b8892c);color:#140f05;border:0;font-size:30px;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer;z-index:15}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);margin:14px 0 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 12px;font-size:13.5px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:#140f05;font-weight:600}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-res{background:var(--bluebg);color:var(--blue)}
.b-cou{background:var(--warnbg);color:var(--warn)}
.b-pre{background:var(--goldsoft);color:var(--gold)}
.b-liv{background:var(--okbg);color:var(--ok)}
.b-ann{background:var(--badbg);color:var(--bad)}
.b-due{background:var(--badbg);color:var(--bad)}
.item{display:flex;gap:12px;align-items:center;cursor:pointer}
.thumb{width:56px;height:56px;border-radius:12px;background:var(--goldsoft);flex:none;object-fit:cover;display:grid;place-items:center;color:var(--gold);font-family:'Great Vibes',cursive;font-size:24px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.grow{flex:1;min-width:0}
.title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.money{font-variant-numeric:tabular-nums;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.empty .big{font-family:'Great Vibes',cursive;font-size:38px;color:var(--gold)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer}
.mod .ph{aspect-ratio:3/4;background:var(--goldsoft);display:grid;place-items:center;color:var(--gold);font-family:'Great Vibes',cursive;font-size:34px}
.mod .ph img{width:100%;height:100%;object-fit:cover}
.mod .info{padding:8px 10px 10px}
.mod .info .title{font-size:14.5px}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 12px;font-size:20px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:500}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold2);border-color:transparent}
.mes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mes label{margin-top:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:84px;border:1px solid var(--line);background:var(--card);padding:10px 6px;border-radius:12px;font-size:14px;cursor:pointer}
.seg button.on{background:var(--gold);border-color:var(--gold);color:#140f05;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.actions .btn{flex:1;min-width:140px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);gap:12px}
.kv:last-child{border:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right}
.photoPick{border:1.5px dashed var(--gold);border-radius:14px;padding:14px;text-align:center;color:var(--gold);cursor:pointer;background:var(--goldsoft)}
.photoPick img{max-width:100%;max-height:220px;border-radius:10px;display:block;margin:0 auto}
.media3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--goldsoft);border:1px solid var(--line)}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot.add{border:1.5px dashed var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--gold);cursor:pointer;font-size:24px;gap:2px}
.slot.add span{font-size:12.5px;font-weight:600}
.slot.wide{aspect-ratio:auto;padding:16px;flex-direction:row;gap:8px}
.slot .x,.vbox .x{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:13px;cursor:pointer}
.slot .tag{position:absolute;left:5px;bottom:5px;background:rgba(0,0,0,.65);color:#e9c46a;font-size:10.5px;padding:2px 6px;border-radius:6px}
.slot .spin{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);font-size:22px}
.vbox{position:relative;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--line)}
.vbox video{width:100%;max-height:300px;display:block}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:12px;scrollbar-width:none;border-radius:16px}
.gal>*{flex:0 0 86%;scroll-snap-align:center;height:360px;object-fit:cover;border-radius:16px;background:#000}
.gal>*:only-child{flex-basis:100%}
.mod .ph{position:relative}
.play{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);color:#e9c46a;display:grid;place-items:center;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0d0b08;color:#e9c46a;border:1px solid #5a4720;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* lock */
#lock{position:fixed;inset:0;background:#0d0b08;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f3ead6;padding:20px}
#lock .logo{width:90px;height:90px;font-size:36px}
#lock h1{font-family:'Great Vibes',cursive;font-weight:400;color:#e9c46a;font-size:44px;margin:14px 0 4px}
#lock p{color:#a89a7e;margin:0 0 16px;text-align:center}
.dots{display:flex;gap:14px;margin:8px 0 22px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid #d9b25a}
.dots i.f{background:#d9b25a}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;border:1px solid #3a3122;background:#1a1610;color:#f3ead6;font-size:26px;cursor:pointer}
.pad button:active{background:#2c2414}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* receipt */
.receipt{background:#fffdf8;color:#1d1912;border-radius:14px;padding:18px;border:1px solid #e6dcc7}
.receipt .rh{text-align:center;border-bottom:1px dashed #c9b88f;padding-bottom:10px;margin-bottom:10px}
.receipt .rh b{font-family:'Great Vibes',cursive;font-size:36px;font-weight:400;color:#b8892c}
.receipt .kv span:first-child{color:#7a6f5c}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%}
}
</style>
</head>
<body>

<div id="lock">
  <div class="logo">Eva</div>
  <h1>Eva Shop</h1>
  <p id="lockMsg">Entrez votre code PIN</p>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad"></div>
</div>

<header>
  <div class="wrap">
    <div class="logo">Eva</div>
    <div class="brand"><h1>Eva Shop</h1><small>Stylistes made in Sénégal</small></div>
    <button class="iconbtn" onclick="openSettings()" aria-label="Réglages">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main class="wrap" id="view"></main>

<button class="fab" id="fab" onclick="fabAction()" aria-label="Ajouter">+</button>

<nav class="tabs"><div class="in">
  <button data-t="home" class="on" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button data-t="resa" onclick="go('resa')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Réservations</button>
  <button data-t="cli" onclick="go('cli')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7M17 11a3 3 0 1 0 0-6M22 21c0-3-2-5.5-5-6.5"/></svg>Clientes</button>
  <button data-t="mod" onclick="go('mod')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3l4 3 4-3 5 4-3 4-2-1v11H8V10l-2 1-3-4z"/></svg>Modèles</button>
</div></nav>

<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===== Données ===== */
const KEY='evashop_v1';
const STATUTS=[
  {k:'res',l:'Réservée',c:'b-res'},
  {k:'cou',l:'En couture',c:'b-cou'},
  {k:'pre',l:'Prête',c:'b-pre'},
  {k:'liv',l:'Livrée',c:'b-liv'},
  {k:'ann',l:'Annulée',c:'b-ann'}
];
const VILLES=['Louga','Touba','Dakar','Autre'];
const PAYS=['Espèces','Wave','Orange Money'];
const MES=[['poitrine','Poitrine'],['taille','Taille'],['hanches','Hanches'],['epaule','Épaule'],['manche','Manche'],['longueur','Longueur'],['bras','Tour bras'],['pantalon','Long. pantalon'],['cuisse','Cuisse']];

let S={pin:'',shop:{nom:'Eva Shop',tel:'',adresse:'Louga · Touba'},clients:[],modeles:[],resas:[],
  web:{topic:'',ghUser:'seck93723-lang',ghRepo:'eva-shop-clientes',ghToken:'',bio:'Stylistes made in Sénégal 🇸🇳 · Tenues de bonne qualité',dirty:true,lastPub:''},seen:[]};
let memOnly=false;
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);d.web=Object.assign({},S.web,d.web||{});S=Object.assign(S,d);}}catch(e){memOnly=true}
  if(!S.web.topic){S.web.topic='evashop-'+Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,8);save()}
  if(!S.seen)S.seen=[];
  S.modeles.forEach(m=>{if(m.photo&&!m.photos)m.photos=[{src:m.photo,thumb:m.photo}];delete m.photo;if(!m.photos)m.photos=[]});}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('⚠️ Mémoire pleine : faites une sauvegarde');}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fcfa=n=>(Math.round(+n||0)).toLocaleString('fr-FR').replace(/ | /g,' ')+' F';
const today=()=>new Date().toISOString().slice(0,10);
function fdate(d){if(!d)return '—';const x=new Date(d+'T12:00');return x.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}
const cli=id=>S.clients.find(c=>c.id===id);
const mod=id=>S.modeles.find(m=>m.id===id);
const total=r=>(+r.prix||0)*(+r.qte||1)+(+r.fraisLiv||0);
const paye=r=>(r.paiements||[]).reduce((a,p)=>a+(+p.m||0),0);
const reste=r=>r.statut==='ann'?0:Math.max(0,total(r)-paye(r));
const st=k=>STATUTS.find(s=>s.k===k)||STATUTS[0];
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)}
function waNum(t){let d=String(t||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.length===9&&/^[37]/.test(d))d='221'+d;return d}
function wa(tel,msg){const n=waNum(tel);window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank')}

/* ===== PIN ===== */
let pinBuf='',pinStep=0,pinFirst='';
function initLock(){
  const pad=$('#pad');
  ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k=>{
    const b=document.createElement('button');b.textContent=k;
    if(!k){b.style.visibility='hidden'}
    b.onclick=()=>pinKey(k);pad.appendChild(b)});
  if(!S.pin){$('#lockMsg').textContent='Créez un code PIN (4 chiffres)';pinStep=1}
}
function pinKey(k){
  if(k==='⌫'){pinBuf=pinBuf.slice(0,-1)}else if(pinBuf.length<4){pinBuf+=k}
  [...$('#dots').children].forEach((d,i)=>d.classList.toggle('f',i<pinBuf.length));
  if(pinBuf.length<4)return;
  setTimeout(()=>{
    if(pinStep===1){pinFirst=pinBuf;pinStep=2;$('#lockMsg').textContent='Confirmez le code PIN';}
    else if(pinStep===2){
      if(pinBuf===pinFirst){S.pin=pinBuf;save();unlock()}
      else{pinStep=1;$('#lockMsg').textContent='Codes différents. Recommencez';shake()}
    } else {
      if(pinBuf===S.pin)unlock(); else {$('#lockMsg').textContent='Code incorrect';shake()}
    }
    pinBuf='';[...$('#dots').children].forEach(d=>d.classList.remove('f'));
  },120);
}
function shake(){const d=$('#dots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')}
function unlock(){$('#lock').style.display='none';render();pollNtfy()}

/* ===== Réservations en ligne (page clientes → ntfy) ===== */
let polling=false;
async function pollNtfy(manual){
  if(!S.web.topic||polling||!S.pin||$('#lock').style.display!=='none')return;
  polling=true;let n=0;
  try{
    const r=await fetch('https://ntfy.sh/'+encodeURIComponent(S.web.topic)+'/json?poll=1&since=12h');
    const t=await r.text();
    t.split('\n').forEach(l=>{
      if(!l.trim())return;let m;try{m=JSON.parse(l)}catch(e){return}
      if(m.event!=='message'||S.seen.includes(m.id))return;
      S.seen.push(m.id);
      const i=(m.message||'').indexOf('#DATA#');if(i<0)return;
      let d;try{d=JSON.parse(m.message.slice(i+6))}catch(e){return}
      if(importOnline(d))n++;
    });
    S.seen=S.seen.slice(-400);save();
    if(n){render();toast(n+' nouvelle(s) réservation(s) en ligne 🎉')}else if(manual)toast('Aucune nouvelle réservation');
  }catch(e){if(manual)toast('Pas de connexion internet')}
  polling=false;
}
function importOnline(d){
  if(!d||!d.nom)return false;
  if(d.ref&&S.resas.some(r=>r.ref===d.ref))return false;
  const num=waNum(d.tel);
  let c=S.clients.find(x=>num&&waNum(x.tel)===num);
  if(!c){c={id:uid(),nom:d.nom,tel:d.tel||'',ville:d.ville||'',mes:{},note:'',created:today()};S.clients.push(c)}
  if(d.mes&&Object.keys(d.mes).length)c.mes=Object.assign({},c.mes||{},d.mes);
  const m=d.modeleId&&mod(d.modeleId);
  const notes=[d.pay?'Paiement souhaité : '+d.pay:'',d.note||''].filter(Boolean).join(' · ');
  S.resas.push({id:uid(),ref:d.ref||'',created:today(),paiements:[],clientId:c.id,modeleId:m?m.id:'',modeleNom:d.modeleNom||(m&&m.nom)||'',
    taille:d.taille||'',qte:+d.qte||1,prix:m?+m.prix:(+d.prix||0),fraisLiv:0,dateLiv:d.date||'',mode:d.mode||'retrait',ville:d.ville||'',statut:'res',note:notes,online:true,nouveau:true});
  return true;
}

/* ===== Publier le catalogue sur GitHub ===== */
function b64(s){const by=new TextEncoder().encode(s);let bin='';for(let i=0;i<by.length;i+=0x8000)bin+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(bin)}
function catalogue(){
  return {shop:{nom:S.shop.nom,tel:S.shop.tel,adresse:S.shop.adresse,bio:S.web.bio},topic:S.web.topic,
    modeles:S.modeles.filter(m=>m.dispo!==false).slice().reverse().map(m=>({id:m.id,nom:m.nom,prix:m.prix,tailles:m.tailles,desc:m.desc,photos:(m.photos||[]).map(p=>p.src),video:m.video?m.video.src:'',tiktok:m.tiktok||''})),
    updated:new Date().toISOString()};
}
const pageUrl=()=>`https://${S.web.ghUser}.github.io/${S.web.ghRepo}/`;
async function publishCatalogue(){
  if($('#wUser'))saveWeb(true);
  const w=S.web;
  if(!w.ghUser||!w.ghRepo||!w.ghToken){alert('Remplissez le compte GitHub, le dépôt et le token dans Réglages → Page clientes.');openSettings();return}
  if(!S.shop.tel&&!confirm('Le numéro WhatsApp de la boutique est vide : les clientes ne pourront pas vous écrire. Publier quand même ?'))return;
  const url=`https://api.github.com/repos/${w.ghUser}/${w.ghRepo}/contents/catalogue.json`;
  const h={Authorization:'Bearer '+w.ghToken,Accept:'application/vnd.github+json'};
  toast('Publication en cours…');
  try{
    let sha;const g=await fetch(url+'?t='+Date.now(),{headers:h,cache:'no-store'});
    if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error('GitHub '+g.status);
    const body={message:'Catalogue '+new Date().toLocaleString('fr-FR'),content:b64(JSON.stringify(catalogue()))};if(sha)body.sha=sha;
    const p=await fetch(url,{method:'PUT',headers:h,body:JSON.stringify(body)});
    if(!p.ok)throw new Error('GitHub '+p.status);
    w.dirty=false;w.lastPub=new Date().toISOString();save();render();
    toast('Catalogue publié ✓ (visible dans 1-2 min)');
  }catch(e){alert('Erreur : '+e.message+'\n\n401 = token faux ou expiré\n403 = le token n\'a pas le droit « Contents : Read and write »\n404 = nom du compte ou du dépôt faux')}
}
function dlCatalogue(){
  const b=new Blob([JSON.stringify(catalogue())],{type:'application/json'});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='catalogue.json';document.body.appendChild(a);a.click();a.remove();
}

function pubBanner(){
  if(!S.web.dirty||!S.modeles.length)return '';
  return `<div class="card row between" style="background:var(--goldsoft);border-color:var(--gold2)"><div class="small"><b>Page clientes pas à jour</b><br>Publiez pour montrer vos modèles.</div><button class="btn sm" onclick="publishCatalogue()">📤 Publier</button></div>`;
}

/* ---- médias (3 photos + 1 vidéo) ---- */
const MAXV=45; // Mo
const hasGH=()=>!!(S.web.ghUser&&S.web.ghRepo&&S.web.ghToken);
const mediaUrl=src=>!src?'':(/^(data:|https?:|blob:)/.test(src)?src:pageUrl()+src);
function cover(m){const p=(m.photos||[])[0];return p?(p.thumb||mediaUrl(p.src)):''}
async function ghPut(path,content,msg){
  const w=S.web,url=`https://api.github.com/repos/${w.ghUser}/${w.ghRepo}/contents/${path}`;
  const r=await fetch(url,{method:'PUT',headers:{Authorization:'Bearer '+w.ghToken,Accept:'application/vnd.github+json'},body:JSON.stringify({message:msg||('Média '+path),content})});
  if(!r.ok)throw new Error('GitHub '+r.status);
  return path;
}
function resize(file,max,q){return new Promise((ok,ko)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);ok(cv.toDataURL('image/jpeg',q))};img.onerror=ko;img.src=u})}
function fileB64(file){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=ko;r.readAsDataURL(file)})}

let tmpPhotos=[],tmpVideo=null,busy=0,editId='';
function editModele(id){
  const m=id?mod(id):{id:'',nom:'',prix:'',dispo:true,desc:'',tailles:'',photos:[],video:null,tiktok:''};
  editId=m.id||uid();
  tmpPhotos=(m.photos||[]).map(p=>Object.assign({},p));tmpVideo=m.video?Object.assign({},m.video):null;busy=0;
  sheet(`<h3>${id?'Modifier le modèle':'Nouveau modèle'}</h3>
  <label style="margin-top:0">Photos (3 max)</label>
  <div class="media3" id="mPhotos"></div>
  <label>Vidéo</label>
  <div id="mVideo"></div>
  <input type="file" id="fPhoto" accept="image/*" multiple style="display:none" onchange="addPhotos(this)">
  <input type="file" id="fVideo" accept="video/*" style="display:none" onchange="addVideo(this)">
  ${hasGH()?'':`<p class="small" style="color:var(--warn);margin:6px 0 0">Pour ajouter une vidéo, remplissez d'abord GitHub dans ⚙️ Réglages → Page clientes.</p>`}
  <label>Lien TikTok de la vidéo (facultatif)</label><input id="mTiktok" value="${esc(m.tiktok||'')}" placeholder="https://www.tiktok.com/@evababy511/video/…" autocapitalize="off">
  <label>Nom du modèle</label><input id="mNom" value="${esc(m.nom)}" placeholder="ex. Ensemble wax doré">
  <div class="grid2"><div><label>Prix (F)</label><input id="mPrix" type="number" inputmode="numeric" value="${m.prix}"></div>
  <div><label>Tailles</label><input id="mTailles" value="${esc(m.tailles||'')}" placeholder="S M L XL"></div></div>
  <label>Description</label><textarea id="mDesc" placeholder="Tissu, couleurs…">${esc(m.desc||'')}</textarea>
  <label>Disponibilité</label><div class="seg" id="mDispo"><button type="button" class="${m.dispo!==false?'on':''}" data-v="1" onclick="segPick(this)">Disponible</button><button type="button" class="${m.dispo===false?'on':''}" data-v="0" onclick="segPick(this)">Épuisé</button></div>
  <div class="actions"><button class="btn ghost" onclick="closeSheet()">Annuler</button><button class="btn" id="mSave" onclick="saveModele('${id||''}')">Enregistrer</button></div>`);
  drawMedia();
}
function drawMedia(){
  const P=$('#mPhotos');if(!P)return;
  let h='';
  for(let i=0;i<3;i++){const p=tmpPhotos[i];
    h+=p?`<div class="slot">${p.wait?'<div class="spin">⏳</div>':''}<img src="${p.thumb||mediaUrl(p.src)}"><button class="x" onclick="delPhoto(${i})">✕</button>${i===0?'<span class="tag">Principale</span>':''}</div>`
        :`<div class="slot add" onclick="$('#fPhoto').click()">📷<span>Ajouter</span></div>`}
  P.innerHTML=h;
  const v=tmpVideo;
  $('#mVideo').innerHTML=v?`<div class="vbox">${v.wait?`<div class="small" style="padding:18px;text-align:center">⏳ Envoi de la vidéo (${v.mo} Mo)…<br>Gardez l'app ouverte.</div>`:`<video src="${v.local||mediaUrl(v.src)}" controls playsinline preload="metadata"></video>`}${v.wait?'':'<button class="x" onclick="delVideo()">✕</button>'}</div>`
    :`<div class="slot add wide" onclick="${hasGH()?"$('#fVideo').click()":"toast('Remplissez GitHub dans Réglages')"}">🎬<span>Ajouter une vidéo (max ${MAXV} Mo)</span></div>`;
  const b=$('#mSave');if(b){b.disabled=busy>0;b.textContent=busy>0?'Envoi en cours…':'Enregistrer'}
}
async function addPhotos(inp){
  const files=[...inp.files].slice(0,3-tmpPhotos.length);inp.value='';
  for(const f of files){
    const p={wait:true};tmpPhotos.push(p);busy++;drawMedia();
    try{
      p.thumb=await resize(f,240,.7);drawMedia();
      if(hasGH()){const full=await resize(f,1080,.8);p.src=await ghPut(`media/${editId}-${uid()}.jpg`,full.split(',')[1])}
      else p.src=await resize(f,700,.72);
    }catch(e){tmpPhotos.splice(tmpPhotos.indexOf(p),1);alert('Photo non envoyée : '+e.message)}
    delete p.wait;busy--;drawMedia();
  }
}
function delPhoto(i){tmpPhotos.splice(i,1);drawMedia()}
async function addVideo(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  const mo=Math.round(f.size/1048576*10)/10;
  if(mo>MAXV){alert(`Vidéo trop lourde (${mo} Mo, max ${MAXV} Mo).\nCoupez-la (15-30 secondes suffisent) ou mettez le lien TikTok.`);return}
  const ext=((f.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,''))||'mp4';
  tmpVideo={wait:true,mo};busy++;drawMedia();
  try{const b=await fileB64(f);tmpVideo.src=await ghPut(`media/${editId}-${uid()}.${ext}`,b,'Vidéo modèle');tmpVideo.local=URL.createObjectURL(f);delete tmpVideo.wait;toast('Vidéo envoyée ✓')}
  catch(e){tmpVideo=null;alert('Vidéo non envoyée : '+e.message+'\nVérifiez internet et le token GitHub.')}
  busy--;drawMedia();
}
function delVideo(){tmpVideo=null;drawMedia()}
function saveModele(id){
  if(busy>0){toast('Attendez la fin de l\'envoi');return}
  const nom=$('#mNom').value.trim();if(!nom){toast('Nom du modèle ?');return}
  const d={nom,prix:+$('#mPrix').value||0,tailles:$('#mTailles').value.trim(),desc:$('#mDesc').value.trim(),dispo:segVal('mDispo')!=='0',
    photos:tmpPhotos.filter(p=>p.src).map(p=>({src:p.src,thumb:p.thumb})),video:tmpVideo&&tmpVideo.src?{src:tmpVideo.src}:null,tiktok:$('#mTiktok').value.trim()};
  if(id)Object.assign(mod(id),d);else S.modeles.push(Object.assign({id:editId},d));
  markDirty();save();closeSheet();render();toast('Modèle enregistré ✓ · pensez à Publier');
}
function gallery(m){
  const items=[];
  if(m.video)items.push(`<video src="${mediaUrl(m.video.src)}" controls playsinline preload="metadata"></video>`);
  (m.photos||[]).forEach(p=>items.push(`<img src="${mediaUrl(p.src)}" onerror="this.src='${p.thumb||''}'">`));
  if(!items.length)return '';
  return `<div class="gal">${items.join('')}</div>${items.length>1?`<div class="small muted" style="text-align:center;margin:-4px 0 10px">← glissez pour voir ${items.length} ${m.video?'(vidéo + photos)':'photos'} →</div>`:''}`;

  rd.readAsText(f);
}
